{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platforminit-ops-center.fullname" . }}-ui
  labels:
    {{- include "platforminit-ops-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.targetPort }}
      protocol: {{ .Values.ui.service.protocol }}
      name: {{ .Values.ui.service.name }}
  selector:
    {{- include "platforminit-ops-center.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
