{{- if and .Values.ui.enabled .Values.ui.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platforminit-ops-center.ui.serviceAccountName" . }}
  labels:
    {{- include "platforminit-ops-center.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.ui.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
