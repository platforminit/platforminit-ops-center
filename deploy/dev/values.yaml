# =============================================================================
# PlatformInit Ops Center — dev overrides for platforminit-dev-01
# =============================================================================
# This values file is intended for the development environment on
# platforminit-dev-01.  It overrides the defaults from
# charts/platforminit-ops-center/values.yaml.

namespaceOverride: platforminit-ops-center-dev

# Use placeholder image refs — real images are built and pushed separately.
# Production deployments MUST use immutable version tags or digests.
api:
  image:
    repository: ghcr.io/platforminit/ops-center-api
    tag: "0.1.0-dev"

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ui:
  image:
    repository: ghcr.io/platforminit/ops-center-ui
    tag: "0.1.0-dev"

  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

